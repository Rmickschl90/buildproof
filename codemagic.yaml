workflows:
  ios-workflow:
    name: Leeward iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # This name must exactly match the App Store Connect API key name
      # you add under Codemagic Team settings > Developer Portal > Manage keys.
      app_store_connect: leeward_appstore
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.linquelabs.leewardapp
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
      xcode: latest
      node: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sync web assets and native plugin config
        script: |
          # 2026-08-06: was `npx cap copy ios`, which only copies web assets
          # and capacitor.config.json into the native project -- it does NOT
          # regenerate native plugin registrations (ios/App/CapApp-SPM/Package.swift
          # for Swift Package Manager). That meant newly-added Capacitor
          # plugins (@capacitor/app, @capacitor/browser, added for the native
          # checkout fix) were never actually wired into the built .ipa, even
          # though they were correctly in package.json -- confirmed live on a
          # real device: TestFlight build 10 threw "'Browser' plugin is not
          # implemented on ios" at the exact moment the app tried to open
          # Stripe checkout. `cap sync` = `cap copy` + `cap update`, and
          # `cap update` is the step that actually regenerates Package.swift's
          # plugin dependency list. This is the only environment that can run
          # this correctly (no local Mac/Xcode for this project), so this has
          # to happen here, on every build, rather than being a one-time local
          # fix the way the Android equivalent (npx cap sync android) was.
          npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Bump build number
        script: |
          # Apple rejects an upload whose CFBundleVersion (build number)
          # isn't strictly higher than the last one it received. The repo
          # always has CURRENT_PROJECT_VERSION committed as a fixed
          # placeholder, so stamp in Codemagic's own auto-incrementing
          # $BUILD_NUMBER here at build time -- never committed back,
          # every fresh build run gets a fresh, higher number automatically.
          cd ios/App
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" App.xcodeproj/project.pbxproj
      - name: Build ipa for distribution
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - rmickschl23@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Flip this to true once the App Store Connect app record exists
        # (create it manually first — Codemagic docs recommend this) and
        # you're ready for builds to reach TestFlight testers automatically.
        submit_to_testflight: false
        # Leave false until we're actually ready for a public App Store
        # release — this is a separate, later step.
        submit_to_app_store: false
